name: Auto Generate & Post Daily Pixar 3D Cartoon Shorts

on:
  schedule:
    # 1. Fajr (Dawn / Morning): 06:00 AM IST (00:30 UTC)
    - cron: '30 0 * * *'
    # 2. Dhuhr / Zohar (Midday): 01:30 PM IST (08:00 UTC)
    - cron: '0 8 * * *'
    # 3. Asr (Late Afternoon): 05:00 PM IST (11:30 UTC)
    - cron: '30 11 * * *'
    # 4. Maghrib (Sunset): 06:30 PM IST (13:00 UTC)
    - cron: '0 13 * * *'
    # 5. Isha (Night / Bedtime): 08:45 PM IST (15:15 UTC)
    - cron: '15 15 * * *'
  workflow_dispatch:

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'
            cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-noto-core fonts-noto-extra fonts-indic

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Pixar 3D Story Pipeline
        env:
          INSTAGRAM_SESSION_ID: ${{ secrets.INSTAGRAM_SESSION_ID }}
          FACEBOOK_SESSION_ID: ${{ secrets.FACEBOOK_SESSION_ID }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          STORY_VOICE: "ur-IN-GulNeural"
        run: |
          python main.py

      - name: Upload Generated Pixar Video as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixar-3d-video
          path: final_pixar_short.mp4
          retention-days: 7

      - name: Commit Updated Story History
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add used_stories.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update posted stories history [skip ci]" && git push)
